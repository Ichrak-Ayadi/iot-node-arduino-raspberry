<svg viewBox="0 0 1420 540" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1420" height="540" fill="#ffffff"/>
  <text x="710" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">IoT environment monitoring: data path</text>

  <!-- Raspberry Pi frame -->
  <rect x="200" y="60" width="990" height="340" rx="14" fill="#f4f8f4" stroke="#5a8f5a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="215" y="85" font-size="14" font-weight="bold" fill="#3d6b3d">Raspberry Pi (Raspberry Pi OS, 64-bit)</text>

  <!-- Arduino -->
  <rect x="20" y="170" width="150" height="70" rx="8" fill="#e3f0fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="95" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4d77">Arduino</text>
  <text x="95" y="219" text-anchor="middle" font-size="11" fill="#1d4d77">Nano 33 BLE Sense</text>

  <!-- ble_bridge -->
  <rect x="225" y="170" width="140" height="70" rx="8" fill="#fff4dc" stroke="#b8860b" stroke-width="2"/>
  <text x="295" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b4e00">ble_bridge.py</text>
  <text x="295" y="219" text-anchor="middle" font-size="11" fill="#6b4e00">service: ble-bridge</text>

  <!-- Mosquitto -->
  <rect x="425" y="170" width="140" height="70" rx="8" fill="#efe6fa" stroke="#6b3fa0" stroke-width="2"/>
  <text x="495" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#43236b">Mosquitto</text>
  <text x="495" y="219" text-anchor="middle" font-size="11" fill="#43236b">MQTT broker :1883</text>

  <!-- influx_logger -->
  <rect x="625" y="170" width="140" height="70" rx="8" fill="#fff4dc" stroke="#b8860b" stroke-width="2"/>
  <text x="695" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b4e00">influx_logger.py</text>
  <text x="695" y="219" text-anchor="middle" font-size="11" fill="#6b4e00">service: influx-logger</text>

  <!-- InfluxDB -->
  <rect x="825" y="170" width="140" height="70" rx="8" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="2"/>
  <text x="895" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5233">InfluxDB 2</text>
  <text x="895" y="219" text-anchor="middle" font-size="11" fill="#1b5233">bucket mesures :8086</text>

  <!-- Grafana -->
  <rect x="1025" y="170" width="140" height="70" rx="8" fill="#fde9d9" stroke="#c4631d" stroke-width="2"/>
  <text x="1095" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a3a0d">Grafana</text>
  <text x="1095" y="219" text-anchor="middle" font-size="11" fill="#7a3a0d">dashboard :3000</text>

  <!-- firebase_logger -->
  <rect x="425" y="300" width="140" height="70" rx="8" fill="#fff4dc" stroke="#b8860b" stroke-width="2"/>
  <text x="495" y="329" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b4e00">firebase_logger.py</text>
  <text x="495" y="349" text-anchor="middle" font-size="11" fill="#6b4e00">archive of values</text>

  <!-- Firebase cloud -->
  <rect x="425" y="450" width="140" height="60" rx="8" fill="#f3f3f3" stroke="#777" stroke-width="2"/>
  <text x="495" y="476" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Firebase</text>
  <text x="495" y="494" text-anchor="middle" font-size="11" fill="#333">cloud database</text>

  <!-- Browser -->
  <rect x="1250" y="170" width="140" height="70" rx="8" fill="#f3f3f3" stroke="#777" stroke-width="2"/>
  <text x="1320" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Web browser</text>
  <text x="1320" y="219" text-anchor="middle" font-size="11" fill="#333">PC or phone</text>

  <!-- Arrows main chain -->
  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="170" y1="205" x2="223" y2="205"/>
    <line x1="365" y1="205" x2="423" y2="205"/>
    <line x1="565" y1="205" x2="623" y2="205"/>
    <line x1="765" y1="205" x2="823" y2="205"/>
    <line x1="965" y1="205" x2="1023" y2="205"/>
    <line x1="1165" y1="205" x2="1248" y2="205"/>
    <line x1="495" y1="240" x2="495" y2="298"/>
    <line x1="495" y1="370" x2="495" y2="448"/>
  </g>

  <!-- Arrow labels -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="197" y="195">BLE</text>
    <text x="394" y="195">publish</text>
    <text x="594" y="195">subscribe</text>
    <text x="794" y="195">write</text>
    <text x="994" y="195">Flux</text>
    <text x="1206" y="195">HTTP</text>
    <text x="545" y="272" text-anchor="start">subscribe</text>
    <text x="545" y="420" text-anchor="start">HTTPS</text>
  </g>

  <!-- Topics note -->
  <text x="495" y="146" text-anchor="middle" font-size="12" fill="#43236b">topics: /temperature  /humidite  /pression</text>
  <text x="895" y="146" text-anchor="middle" font-size="12" fill="#1b5233">measurement: environnement</text>
  <text x="895" y="162" text-anchor="middle" font-size="12" fill="#1b5233">fields: temperature, humidite, pression</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
